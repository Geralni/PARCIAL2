# Respuesta SUNAT / OSE (CDR)
# JSON Schema 2020-12 escrito en YAML. Convenciones: x-trazabilidad (fila MT-xxx o 'interno'), x-reglas (REG-xxx).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://specs.abc-software-corp.local/schemas/respuesta-sunat.schema.yaml
title: Respuesta SUNAT / OSE (CDR)
description: Constancia de recepción o ticket de proceso asíncrono. Los códigos de respuesta oficiales no están en el workspace
  (PENDIENTE); se guardan tal cual.
type: object
additionalProperties: false
required:
- canal
- resultado
- fechaRecepcion
properties:
  canal:
    enum:
    - OSE
    - SUNAT
    x-trazabilidad: interno
  ticket:
    type: string
    x-trazabilidad: interno
    description: Para baja y resumen (asíncronos).
  resultado:
    enum:
    - ACEPTADO
    - ACEPTADO_CON_OBSERVACIONES
    - RECHAZADO
    - EN_PROCESO
    - ERROR_COMUNICACION
    x-trazabilidad: interno
    description: SUP-06.
  codigoRespuesta:
    type: string
    x-trazabilidad: interno
  descripcion:
    type: string
    x-trazabilidad: interno
  observaciones:
    type: array
    items:
      type: string
    x-trazabilidad: interno
  fechaRecepcion:
    type: string
    format: date-time
    x-trazabilidad: interno
  cdrHash:
    type: string
    x-trazabilidad: interno
    description: Hash del CDR almacenado; el ZIP se descarga por la API (descargarCdr).
