# Tipos comunes (value objects)
# JSON Schema 2020-12 escrito en YAML. Convenciones: x-trazabilidad (fila MT-xxx o 'interno'), x-reglas (REG-xxx).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://specs.abc-software-corp.local/schemas/common.schema.yaml
title: Tipos comunes (value objects)
description: 'Value objects reutilizados por todos los contratos. Los montos son strings decimales para no perder precisión
  (REG-067). Convención: x-trazabilidad = fila de la matriz (MT-xxx) o ''interno''; x-reglas = reglas de reglas-de-validacion.md.'
$defs:
  Uuid:
    type: string
    format: uuid
    x-trazabilidad: interno
  Monto:
    description: 'n(12,2): hasta 12 enteros y 2 decimales.'
    type: string
    pattern: ^-?\d{1,12}(\.\d{1,2})?$
    x-reglas:
    - REG-067
  MontoAnticipo:
    description: n(15,2).
    type: string
    pattern: ^\d{1,15}(\.\d{1,2})?$
    x-reglas:
    - REG-067
  Cantidad:
    description: n(12,10).
    type: string
    pattern: ^\d{1,12}(\.\d{1,10})?$
    x-reglas:
    - REG-067
    - REG-135
  PrecioUnitario:
    description: n(12,10).
    type: string
    pattern: ^\d{1,12}(\.\d{1,10})?$
    x-reglas:
    - REG-067
  Porcentaje:
    description: n(3,5).
    type: string
    pattern: ^\d{1,3}(\.\d{1,5})?$
    x-reglas:
    - REG-067
  Fecha:
    description: yyyy-mm-dd (Anexo 9-A).
    type: string
    format: date
  Hora:
    description: hh:mm:ss (xsd:time). DISC-16.
    type: string
    pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
    x-reglas:
    - REG-082
  Periodo:
    description: AAAAMM.
    type: string
    pattern: ^\d{4}(0[1-9]|1[0-2])$
  Ruc:
    description: n11. El dígito verificador (REG-041) no se puede expresar en JSON Schema.
    type: string
    pattern: ^\d{11}$
    x-reglas:
    - REG-040
    - REG-041
  Serie:
    description: F### / B### (electrónica) o NNNN (contingencia).
    type: string
    pattern: ^([FB][A-Z0-9]{3}|\d{4})$
    x-reglas:
    - REG-030
    - REG-031
    - REG-033
  Correlativo:
    description: Hasta 8 dígitos (NNNNNNNN).
    type: integer
    minimum: 1
    maximum: 99999999
    x-reglas:
    - REG-035
  CodigoEstablecimiento:
    description: Código SUNAT del establecimiento (AddressTypeCode n4).
    type: string
    pattern: ^\d{4}$
    x-reglas:
    - REG-036
  Ubigeo:
    description: '6 dígitos (Anexo 9-A pág. 13: n6, Catálogo 13).'
    type: string
    pattern: ^\d{6}$
    x-reglas:
    - REG-038
  Texto100:
    type: string
    minLength: 1
    maxLength: 100
    x-reglas:
    - REG-100
  Texto250:
    type: string
    minLength: 1
    maxLength: 250
    x-reglas:
    - REG-100
  Direccion:
    type: object
    additionalProperties: false
    properties:
      ubigeo:
        $ref: '#/$defs/Ubigeo'
        x-trazabilidad: MT-077
        description: Catálogo 13 (PENDIENTE). En UBL solo se exporta para el domicilio del emisor en la boleta (MT-077, DISC-24).
      departamento:
        type: string
        maxLength: 100
        x-trazabilidad: interno
      provincia:
        type: string
        maxLength: 100
        x-trazabilidad: interno
      distrito:
        type: string
        maxLength: 100
        x-trazabilidad: interno
      linea:
        type: string
        maxLength: 200
        x-trazabilidad: interno
  ReferenciaDocumento:
    description: Comprobante referenciado por tipo, serie y correlativo.
    type: object
    additionalProperties: false
    required:
    - tipo
    - serie
    - correlativo
    properties:
      tipo:
        $ref: catalogos.schema.yaml#/$defs/Cat01
        x-trazabilidad: MT-100
      serie:
        $ref: '#/$defs/Serie'
        x-trazabilidad: MT-099
      correlativo:
        $ref: '#/$defs/Correlativo'
        x-trazabilidad: MT-099
  CargoDescuento:
    type: object
    additionalProperties: false
    required:
    - esCargo
    - codigo
    - monto
    x-reglas:
    - REG-024
    properties:
      esCargo:
        type: boolean
        x-trazabilidad: MT-029
      codigo:
        $ref: catalogos.schema.yaml#/$defs/Cat53
        x-trazabilidad: MT-030
      factor:
        $ref: '#/$defs/Porcentaje'
        x-trazabilidad: MT-031
      monto:
        $ref: '#/$defs/Monto'
        x-trazabilidad: MT-032
      base:
        $ref: '#/$defs/Monto'
        x-trazabilidad: MT-033
  Origen:
    description: Trazabilidad de procedencia (R-01). Inmutable.
    type: object
    additionalProperties: false
    required:
    - fuente
    x-reglas:
    - REG-134
    properties:
      fuente:
        enum:
        - SISTEMA
        - LEGADO
        - CONTINGENCIA
        - DISPOSITIVO_OFFLINE
        x-trazabilidad: interno
      loteImportacion:
        $ref: '#/$defs/Uuid'
        x-trazabilidad: interno
      archivo:
        type: string
        x-trazabilidad: interno
      fila:
        type: integer
        minimum: 1
        x-trazabilidad: interno
      hashFila:
        type: string
        pattern: ^[a-f0-9]{64}$
        x-trazabilidad: interno
      dispositivoId:
        type: string
        x-trazabilidad: interno
