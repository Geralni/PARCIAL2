# Forma de pago
# JSON Schema 2020-12 escrito en YAML. Convenciones: x-trazabilidad (fila MT-xxx o 'interno'), x-reglas (REG-xxx).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://specs.abc-software-corp.local/schemas/forma-pago.schema.yaml
title: Forma de pago
description: 'Contado o crédito con cuotas (ENT-06 §3). Base normativa PENDIENTE (ENT-04, DISC-14): XPath candidatos MT-193..MT-196.'
type: object
additionalProperties: false
required:
- tipo
x-reglas:
- REG-028
- REG-029
properties:
  tipo:
    enum:
    - CONTADO
    - CREDITO
    x-trazabilidad: MT-193
  montoPendiente:
    $ref: common.schema.yaml#/$defs/Monto
    x-trazabilidad: MT-194
  cuotas:
    type: array
    x-trazabilidad: MT-195
    items:
      type: object
      additionalProperties: false
      required:
      - numero
      - monto
      - fechaVencimiento
      properties:
        numero:
          type: integer
          minimum: 1
          x-trazabilidad: MT-195
        monto:
          $ref: common.schema.yaml#/$defs/Monto
          x-trazabilidad: MT-194
        fechaVencimiento:
          $ref: common.schema.yaml#/$defs/Fecha
          x-trazabilidad: MT-196
if:
  properties:
    tipo:
      const: CREDITO
then:
  required:
  - montoPendiente
  - cuotas
  properties:
    cuotas:
      minItems: 1
