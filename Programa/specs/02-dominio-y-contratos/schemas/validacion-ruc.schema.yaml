# Resultado de validación de documento de identidad
# JSON Schema 2020-12 escrito en YAML. Convenciones: x-trazabilidad (fila MT-xxx o 'interno'), x-reglas (REG-xxx).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://specs.abc-software-corp.local/schemas/validacion-ruc.schema.yaml
title: Resultado de validación de documento de identidad
type: object
additionalProperties: false
required:
- tipoDocumento
- numero
- formatoValido
x-reglas:
- REG-040
- REG-041
- REG-042
- REG-043
- REG-046
properties:
  tipoDocumento:
    $ref: catalogos.schema.yaml#/$defs/Cat06
    x-trazabilidad: MT-079
  numero:
    type: string
    x-trazabilidad: MT-078
  formatoValido:
    type: boolean
    x-trazabilidad: interno
  digitoVerificadorValido:
    type:
    - boolean
    - 'null'
    x-trazabilidad: interno
    description: null mientras REG-041 esté PENDIENTE.
  consultaPadron:
    type: object
    additionalProperties: false
    x-trazabilidad: interno
    description: Resultado del ValidadorRucPort (fuente externa); puede faltar sin conexión.
    properties:
      razonSocial:
        type: string
        x-trazabilidad: MT-088
      estado:
        type: string
        x-trazabilidad: interno
      condicion:
        type: string
        x-trazabilidad: interno
      consultadoEn:
        type: string
        format: date-time
        x-trazabilidad: interno
  incidencias:
    type: array
    items:
      type: string
      pattern: ^REG-\d{3}
    x-trazabilidad: interno
